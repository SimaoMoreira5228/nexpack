[workspace]
resolver = "3"
members = [
    "nexpack-core",
    "nexpackd",
    "nxpk",
    "nexpack-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
blake3 = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = "5"
capnp = "0.25"
capnpc = "0.25"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "1.1"
reqwest = { version = "0.13", features = ["json", "rustls", "blocking"] }
sigstore-verify = { version = "0.8", features = ["rustls", "tuf"] }
sigstore-types = "0.8"
sigstore-bundle = "0.8"
sigstore-trust-root = { version = "0.8", features = ["tuf"] }
flate2 = "1.0"
