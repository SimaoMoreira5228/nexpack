name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'version tag (e.g. v0.2.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-tag: ${{ steps.version.outputs.version-tag }}
    steps:
      - uses: actions/checkout@v4
      - name: extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"   # strip leading v regardless of source
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version-tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "releasing nexpack v${VERSION}"

  check-release-exists:
    runs-on: ubuntu-latest
    needs: extract-version
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ needs.extract-version.outputs.version-tag }}" --repo "${{ github.repository }}" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "release ${{ needs.extract-version.outputs.version-tag }} already exists, skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "creating release ${{ needs.extract-version.outputs.version-tag }}"
          fi

  build:
    runs-on: ubuntu-latest
    needs: [extract-version, check-release-exists]
    if: needs.check-release-exists.outputs.exists == 'false'
    steps:
      - uses: actions/checkout@v4

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils gcc make pkg-config libssl-dev zstd

      - name: install capnp
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          command: |
            curl -sL "https://capnproto.org/capnproto-c++-1.1.0.tar.gz" -o /tmp/capnp.tar.gz
            tar xzf /tmp/capnp.tar.gz -C /tmp
            cd /tmp/capnproto-c++-1.1.0
            ./configure --quiet
            make -j$(nproc) --quiet
            sudo make install --quiet
            ldconfig
            capnp compile --version

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target

      - name: build release binaries
        run: cargo build --release

      - name: generate checksums
        run: |
          mkdir -p artifacts
          cp target/release/nexpackd artifacts/nexpackd-linux-x86_64
          cp target/release/nxpk artifacts/nxpk-linux-x86_64
          cd artifacts
          sha256sum *.so > sha256sums.txt 2>/dev/null || true
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: artifacts/
          retention-days: 1

  create-release:
    runs-on: ubuntu-latest
    needs: [extract-version, check-release-exists, build]
    if: needs.check-release-exists.outputs.exists == 'false'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: ./artifacts

      - name: build source tarball
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          git archive --format=tar.gz \
            --prefix=nexpack-${VERSION}/ \
            -o ./artifacts/nexpack-source.tar.gz \
            HEAD

      - name: generate release notes
        id: notes
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          cat > ./artifacts/RELEASE_NOTES.md << EOF
          nexpack ${VERSION}

          what is nexpack
          nexpack is a modern linux portable app format that replaces appimage.
          it gives you proper sandboxing, delta updates, layer deduplication, and
          enforced signing in a single .nxpk file that users download and run.

          downloads
          nxpk-linux-x86_64     -- the cli. handles pack, run, install, updates.
          nexpackd-linux-x86_64 -- the daemon. manages mounts, background updates.
          nexpack-source.tar.gz -- full source.

          how to use
          put nxpk and nexpackd somewhere in your path. then:
            nxpk pack spec.toml       pack a bundle
            nxpk run myapp.nxpk       run it
            nxpk install myapp.nxpk   install it

          on first run the daemon starts automatically. you dont need to start
          nexpackd manually. the elf stub is embedded inside the nxpk binary,
          so nxpk pack and export work without any extra files.

          checksums are in sha256sums.txt. verify with:
            sha256sum -c sha256sums.txt
          EOF

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          gh release create "v${VERSION}" \
            ./artifacts/*-linux-x86_64 \
            ./artifacts/*.tar.gz \
            ./artifacts/sha256sums.txt \
            --title "nexpack ${VERSION}" \
            --notes-file ./artifacts/RELEASE_NOTES.md
